name: Check upstream releases
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ruby curl ca-certificates
      - name: Compare stable upstream releases with the source lock
        run: ruby lib/runtime_tools/upstream_releases.rb
