name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tool:
        type: choice
        options: [mupdf, ffmpeg]
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tool }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Reject non-default-branch dispatches
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ruby ruby-thor
      - run: ruby bin/runtime-tools build "$TOOL" --arch "$ARCH"
        env:
          TOOL: ${{ inputs.tool }}
          ARCH: ${{ matrix.arch }}
      - run: ruby bin/runtime-tools verify "$TOOL" --arch "$ARCH"
        env:
          TOOL: ${{ inputs.tool }}
          ARCH: ${{ matrix.arch }}
      - name: Record an independent clean rebuild comparison
        run: |
          ruby bin/runtime-tools build "$TOOL" --arch "$ARCH" --output repeat-dist
          ruby bin/runtime-tools compare "$TOOL" dist repeat-dist --arch "$ARCH"
        env:
          TOOL: ${{ inputs.tool }}
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - run: sudo apt-get update && sudo apt-get install -y ruby ruby-thor
      - name: Assemble verified release assets
        run: ruby bin/runtime-tools assemble "$TOOL" artifacts dist
        env:
          TOOL: ${{ inputs.tool }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft without overwriting existing releases
        run: ruby bin/runtime-tools draft "$TOOL" dist
        env:
          TOOL: ${{ inputs.tool }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
